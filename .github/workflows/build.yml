name: Build Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-production:
    name: Build production binary
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ github.repository }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-release-cargo-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ github.repository }}-release-npm-${{ hashFiles('package-lock.json') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install front-end dependencies
        run: npm ci

      - name: Build Tauri app (release)
        run: npm run tauri build

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spd-backup-tool-windows
          path: src-tauri/target/release/bundle/
          retention-days: 14
